name: Java Gradle Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: temurin
          cache: gradle
      - name: Build and test with a virtual display
        run: xvfb-run -a ./gradlew --no-daemon build
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: packwiz-installer
          path: build/dist/packwiz-installer.jar
          if-no-files-found: error

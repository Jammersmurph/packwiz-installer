name: Build and Publish Installer

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

# Serialize publication within each channel so rolling assets cannot race.
concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: temurin
          cache: gradle
      - name: Build and test with a virtual display
        run: xvfb-run -a ./gradlew --no-daemon build
      - name: Set up JDK 21 for bootstrapper compatibility test
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - name: Verify packaged GUI on Java 21
        run: >-
          xvfb-run -a java -cp build/classes/java/test
          link.infra.packwiz.installer.ui.gui.BootstrapGuiSmokeTest
          build/dist/packwiz-installer.jar
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: packwiz-installer
          path: build/dist/packwiz-installer.jar
          if-no-files-found: error
      - name: Publish stable release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" build/dist/packwiz-installer.jar \
            --target "$GITHUB_SHA" --latest --generate-notes \
            --title "Installer build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
      - name: Publish rolling development prerelease
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The dev tag and its release intentionally track the newest tested dev build.
          if gh api "repos/$GH_REPO/git/ref/tags/dev" --silent; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/dev" \
              -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/dev -f sha="$GITHUB_SHA" --silent
          fi
          notes="Rolling development build from commit $GITHUB_SHA. Not a stable release."
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev build/dist/packwiz-installer.jar --clobber
            gh release edit dev --prerelease --latest=false \
              --title "Development (rolling)" --notes "$notes"
          else
            gh release create dev build/dist/packwiz-installer.jar \
              --verify-tag --prerelease --latest=false \
              --title "Development (rolling)" --notes "$notes"
          fi

name: Build and Publish Installer

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize stable publication.
concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false

# The bootstrapper compares the JAR's Implementation-Version with the release tag.
# Choose the version before building, and reuse it when publishing.
env:
  INSTALLER_VERSION: build-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: temurin
          cache: gradle
      - name: Build and test with a virtual display
        run: xvfb-run -a ./gradlew --no-daemon build -PinstallerVersion="$INSTALLER_VERSION"
      - name: Set up JDK 21 for bootstrapper compatibility test
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - name: Verify packaged GUI on Java 21
        run: >-
          xvfb-run -a java -cp build/classes/java/test
          link.infra.packwiz.installer.ui.gui.BootstrapGuiSmokeTest
          build/dist/packwiz-installer.jar
          "$INSTALLER_VERSION"
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: packwiz-installer
          path: build/dist/packwiz-installer.jar
          if-no-files-found: error
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$INSTALLER_VERSION" build/dist/packwiz-installer.jar \
            --target "$GITHUB_SHA" --latest --generate-notes \
            --title "Installer build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
